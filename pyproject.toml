[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smeta-estimator"
version = "0.1.0"
description = "Preliminary construction estimate calculation engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl==3.1.5",
    "python-telegram-bot==22.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"smeta_estimator.demo.data" = ["*.csv"]
